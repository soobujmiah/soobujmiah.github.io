name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md and the "Deterministic repository state"
# section of README.md. Do not hand-edit .repo/; it is regenerated by this workflow.
#
# Two jobs, matching the pattern established on skb/ggen/songjog (cheap, side-effect-free CI is
# re-run directly here). The one real side effect in this repository's CI -- publishing to
# GitHub Pages -- lives entirely in deploy.yml's separate "deploy" job and is never touched here.
#   - test: runs tools/repo_knowledge's own unit tests (guards the vendored copy). Allowed to fail.
#   - sync: ALWAYS runs (even if `test`, lint, typecheck, build or check:build fail -- policy
#     rule 4/7: a failed check must still be recorded, not silently dropped).

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Install Node dependencies
        run: npm ci

      - name: Lint + typecheck + build (build signal; build runs every content/design/purity gate)
        id: build
        continue-on-error: true
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Validate static export (test signal)
        id: test_step
        continue-on-error: true
        run: npm run check:build

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      # Guard the vendored verification resolver the same way. 42 tests: schema,
      # classification, failure preservation, idempotency, the public-safe
      # projection filter, and the guardrail that refuses to write internal state
      # into a public path.
      - name: Run tools/verification tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/verification/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          test_status="${{ steps.test_step.outcome == 'success' && 'passed' || 'failed' }}"
          # --project-id override: the repository name "soobujmiah.github.io" contains dots,
          # which schemas/project-registry.schema.json's project_id pattern (^[a-z0-9][a-z0-9-]*$)
          # rejects. "portfolio" is already this project's canonical SKB identifier
          # (soobujmiah/skb -> projects/state/portfolio.md), so use it explicitly rather than
          # relying on auto-inference from the repo name.
          python3 -m tools.repo_knowledge --project-id portfolio sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" --test-summary "check:build (static export validation)"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      # Regenerate the public-safe verification projection that the footer and
      # /verification/ render. Evidence comes from this repository's own
      # .repo/project.yaml plus the public .repo/project.yaml of every
      # repository the canonical claim registry (verification/claims.json,
      # vendored from soobujmiah/skb) points at, read through this job's own
      # ambient same-repository GITHUB_TOKEN -- no new credential, no PAT, no
      # GitHub App key in this repository, and no second scheduler: this is the
      # same push-triggered workflow that already syncs .repo/.
      #
      # --public-only is mandatory: it writes only the projection, never the
      # internal state (the CLI refuses a public path otherwise).
      # --merge carries a claim's previous evidence forward when it cannot be
      # resolved in this run, so a transient API failure never erases the last
      # known good verification.
      - name: Resolve verification claims into public/verification.json
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.verification build --source portfolio \
            --project-id portfolio \
            --out public/verification.json \
            --public-only --merge \
            --summary app/verification-summary.json

      # Registry-vs-schema, then projection-vs-canonical-registry. This
      # repository runs public-only, so no verification/state.json exists
      # and none is written; the CLI verifies the published projection on
      # its own in that configuration instead of demanding one.
      - name: Verify the verification registry and generated projection
        if: always()
        run: python3 -m tools.verification verify --projection public/verification.json

      # Offline gate: canonical registry membership, bilingual copy coverage,
      # status/evidence agreement, no private repository, no secret-shaped field.
      - name: Gate the generated verification data
        if: always()
        run: node scripts/check-verification.mjs

      - name: Commit updated .repo/ and verification state
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo public/verification.json app/verification-summary.json; then
            echo "no .repo/ or verification change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo public/verification.json app/verification-summary.json
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}

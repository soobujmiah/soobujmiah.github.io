name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [skb-verification-updated, repo-state-updated]
  schedule:
    - cron: '47 4 * * *'

permissions:
  contents: read

# Pull requests cancel their superseded runs. Pushes to main do not —
# a half-deployed Pages artifact is worse than a queued one. Each ref
# gets its own group so a PR can never cancel a production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the committed lockfile. The previous
      # workflow used `npm install`, which can silently resolve newer
      # transitive versions than the lockfile records.
      - name: Install dependencies
        run: npm ci

      - name: Resolve public evidence before building the artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m tools.verification build --source portfolio --project-id portfolio \
            --out public/verification.json --public-only --merge --summary app/verification-summary.json
          python3 -m tools.verification verify --projection public/verification.json
          node scripts/check-verification.mjs

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Generate and validate bilingual CVs (EN + BN) before `npm run build`
      # so the freshly generated PDFs are copied into `out/cv/` by Next.js.
      # Installs reportlab, pypdf, uharfbuzz, and fonttools for OpenType shaping.
      - name: Set up Python virtualenv for PDF tools
        run: |
          python3 -m venv .venv-cv
          .venv-cv/bin/pip install reportlab pypdf uharfbuzz fonttools

      - name: Generate and validate bilingual CVs
        run: |
          .venv-cv/bin/python3 tools/make_cv_en.py
          .venv-cv/bin/python3 tools/make_cv_bn.py
          .venv-cv/bin/python3 tools/validate_cvs.py

      # `npm run build` runs `prebuild` first, which is `npm run check`:
      # bilingual parity + two-way language purity + adversarial purity
      # suite + design-token/document drift. A failing gate fails the
      # build, so nothing unverified can reach Pages.
      - name: Build (runs the content, purity and design gates)
        run: npm run build

      # Validates the exported artifact itself: 34 primary bilingual routes
      # plus four canonicalized legacy URLs; checks server-rendered text,
      # metadata, sitemap XML/alternates, robots/social assets and JS budgets.
      - name: Validate static export, deep links and budget
        run: npm run check:build

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Commit the exact evidence snapshot included in the artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 -m tools.verification verify --projection public/verification.json
          node scripts/check-verification.mjs
          git add public/verification.json app/verification-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(repo-knowledge): publish accepted public evidence snapshot'
          git push origin HEAD:main

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

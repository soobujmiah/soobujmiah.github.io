name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests cancel their superseded runs. Pushes to main do not —
# a half-deployed Pages artifact is worse than a queued one. Each ref
# gets its own group so a PR can never cancel a production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the committed lockfile. The previous
      # workflow used `npm install`, which can silently resolve newer
      # transitive versions than the lockfile records.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # `npm run build` runs `prebuild` first, which is `npm run check`:
      # bilingual parity + two-way language purity + adversarial purity
      # suite + design-token/document drift. A failing gate fails the
      # build, so nothing unverified can reach Pages.
      - name: Build (runs the content, purity and design gates)
        run: npm run build

      # Validates the exported artifact itself: 9 real routes with
      # server-rendered text, per-route title/canonical/social card,
      # robots/sitemap/og.png presence, and the JavaScript budget.
      - name: Validate static export, deep links and budget
        run: npm run check:build

      # Generate and validate bilingual CVs (EN + BN) from source scripts.
      # Fails the build if either PDF is missing, contains forbidden scripts,
      # or lacks required clickable links.
      - name: Install Bengali font (GitHub Actions ubuntu-latest)
        run: sudo apt-get install -y fonts-noto-bengali
      - name: Set up Python virtualenv for PDF tools
        run: python3 -m venv .venv-cv && .venv-cv/bin/pip install reportlab pypdf
      - name: Generate and validate bilingual CVs
        run: |
          .venv-cv/bin/python3 tools/make_cv_en.py
          .venv-cv/bin/python3 tools/make_cv_bn.py
          .venv-cv/bin/python3 tools/validate_cvs.py

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
